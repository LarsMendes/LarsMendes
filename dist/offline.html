<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - UNITY.40</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            padding: 48px 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 24px;
            background: linear-gradient(180deg, #bbf7d0 0%, #4ade80 50%, #22c55e 100%);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }
        
        h1 {
            color: #1e293b;
            font-size: 28px;
            margin-bottom: 12px;
            font-weight: 600;
        }
        
        p {
            color: #64748b;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        
        .button {
            background: linear-gradient(180deg, #bbf7d0 0%, #4ade80 50%, #22c55e 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(34, 197, 94, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
        }
        
        .button:active {
            transform: translateY(0);
        }
        
        .status {
            margin-top: 24px;
            padding: 12px;
            background: #fef3c7;
            border-radius: 8px;
            color: #92400e;
            font-size: 14px;
            display: none;
        }
        
        .status.online {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }
        
        .status.offline {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">💬</div>
        <h1>Você está offline</h1>
        <p>Não foi possível conectar ao UNITY.40 Messenger. Verifique sua conexão com a internet e tente novamente.</p>
        <button class="button" onclick="tryReconnect()">Tentar Reconectar</button>
        <div id="status" class="status"></div>
    </div>
    
    <script>
        function updateOnlineStatus() {
            const status = document.getElementById('status');
            if (navigator.onLine) {
                status.textContent = '✓ Conexão restaurada! Clique em "Tentar Reconectar"';
                status.className = 'status online';
            } else {
                status.textContent = '✗ Ainda sem conexão';
                status.className = 'status offline';
            }
        }
        
        function tryReconnect() {
            if (navigator.onLine) {
                window.location.href = '/';
            } else {
                updateOnlineStatus();
            }
        }
        
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        
        // Check initial status
        updateOnlineStatus();
    </script>
</body>
</html>
